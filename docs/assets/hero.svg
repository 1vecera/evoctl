<text x="398" y="370" fill="#f2f7f1" font-family="JetBrainsMono Nerd Font, DejaVu Sans Mono, monospace" font-size="19" font-weight="400">182 routes</text>
<rect x="638" y="56" width="586" height="332" rx="22" fill="#111a14" stroke="#29372d"/>
<text x="666" y="92" fill="#99aa9e" font-family="JetBrainsMono Nerd Font, DejaVu Sans Mono, monospace" font-size="15" font-weight="400">ONE PROFILE. EVERY WORKFLOW.</text>
