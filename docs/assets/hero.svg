<text x="844" y="304" fill="#b0f275" font-family="JetBrainsMono Nerd Font, DejaVu Sans Mono, monospace" font-size="22" font-weight="400">read</text>
<text x="914" y="304" fill="#99aa9e" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400">→</text>
