<text x="668" y="153" fill="#f2f7f1" font-family="JetBrainsMono Nerd Font, DejaVu Sans Mono, monospace" font-size="21" font-weight="400">$ evoctl status</text>
<text x="668" y="192" fill="#f2f7f1" font-family="JetBrainsMono Nerd Font, DejaVu Sans Mono, monospace" font-size="21" font-weight="400">$ evoctl contacts search "Alex"</text>
<text x="668" y="231" fill="#f2f7f1" font-family="JetBrainsMono Nerd Font, DejaVu Sans Mono, monospace" font-size="21" font-weight="400">$ evoctl messages read JID</text>
