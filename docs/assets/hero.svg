<text x="56" y="192" fill="#f2f7f1" font-family="Liberation Sans, Arial, sans-serif" font-size="52" font-weight="700">Your WhatsApp</text>
<text x="56" y="252" fill="#f2f7f1" font-family="Liberation Sans, Arial, sans-serif" font-size="52" font-weight="700">control room.</text>
<text x="58" y="300" fill="#99aa9e" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="400">Evolution API. Local, HTTPS, or SSH.</text>
